services:
  postgres:
    image: postgres:17-alpine
    container_name: justeks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: justeks
      POSTGRES_USER: justeks
      POSTGRES_PASSWORD: justeks_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - justeks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justeks -d justeks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: justeks-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  justeks-pgdata:
