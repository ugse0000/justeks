# JUSTEKS — kurumsal site (statik, prerender edilmis)
#
# Bu sunucuda 80/443'u nginx dinliyor ve uzerinde baska siteler yayinda.
# Bu dosya sertifikadan onceki HTTP halidir; certbot --nginx 443 blogunu ve
# yonlendirmeyi kendisi ekler.
#
#   sudo ln -s /etc/nginx/sites-available/justeks /etc/nginx/sites-enabled/justeks
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d justeks.com -d www.justeks.com

server {
    server_name justeks.com www.justeks.com;

    root /var/www/justeks;
    index index.html;

    # Sertifika yenilemesi uygulamaya degil diske gitmeli.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Site prerender edilmis: her rota kendi index.html dosyasina sahip.
    # Eslesmeyen yol 404.html'e duser (SPA fallback degil - 200 dondurmek
    # bulunamayan sayfayi arama motoruna gecerli sayfa gibi gosterirdi).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Icerik hash'li dosya adlari: guvenle uzun sureli onbellege alinir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML her dagitimda degisebilir; bayat sayfa servis etmeyelim.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 12M;


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/justeks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/justeks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.justeks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = justeks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name justeks.com www.justeks.com;
    listen 80;
    return 404; # managed by Certbot




}
