name: CI

# Derleme ve testler. Yayin artik GitHub Pages'te degil: site kendi
# sunucumuzda (nginx) duruyor ve `scripts/deploy.ps1` ile gonderiliyor.
# Bu is akisi, gonderilen seyin once yesil oldugunu dogrular.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Testler derlemeden sonra: prerender testleri dist/ ciktisini okur ve
      # derleme olmadan kendilerini atlarlar.
      - run: npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testler Testcontainers ile gercek bir Postgres 17 baslatir; ubuntu
      # kosucusunda Docker hazir gelir.
      - run: mvn --batch-mode test
